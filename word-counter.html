<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Counter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: min(500px, 90vw);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      resize: vertical;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .count {
      margin-top: 1rem;
      font-size: 1.1rem;
    }
    .count strong {
      color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Word Counter</h1>
    <textarea id="text" placeholder="Type or paste text here..."></textarea>
    <p class="count">Words: <strong id="count">0</strong></p>
  </div>

  <script>
    const textarea = document.getElementById("text");
    const count = document.getElementById("count");

    function countWords() {
      const words = textarea.value.split(" ").filter(function (w) {
        return w.trim() !== "";
      });
      count.textContent = words.length;
    }

    textarea.addEventListener("input", countWords);
  </script>
</body>
</html>
